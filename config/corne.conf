# ZMK config for Corne (nice!nano v2 / nRF52840)

CONFIG_ZMK_POINTING=y

# Mouse movement

# Key scan debounce (default kscan is 5ms, too low for cheap switches -> ghosting/double press)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=12
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12

# Bluetooth latency tuning
# Latency must stay zero for responsive mouse movement. The interval is kept
# tight (7.5-11.25 ms) because with a congested 2.4 GHz band (e.g. A2DP audio)
# a longer interval delays every retransmission and the cursor becomes laggy.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# BLE TX power: +8 dBm keeps HID packets from being lost/retried when the
# laptop radio is busy with Bluetooth audio. 0 dBm is noticeably laggy there.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows quirks: disable 2M PHY (Realtek/Intel chipsets), skip GATT subscription enforcement (battery notif bug)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Deep sleep after 15 min idle
CONFIG_ZMK_SLEEP=y

# OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# Lower OLED contrast to reduce display power while retaining readability.
CONFIG_SSD1306_DEFAULT_CONTRAST=40
