# ZMK config for Corne (nice!nano v2 / nRF52840)

# Mouse emulation: &mkp &mmv &msc
CONFIG_ZMK_POINTING=y
# NOTE: do NOT enable CONFIG_ZMK_POINTING_SMOOTH_SCROLLING — it advertises a HID
# resolution multiplier of 15 (resolution_multipliers.c default), so the host
# divides wheel deltas by 15 and scroll crawls.

# BLE latency tuning (lower = less lag, higher battery draw)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Deep sleep after 15 min idle (only central half; peripheral must stay awake)
CONFIG_ZMK_SLEEP=y

# OLED layer indicator (SSD1306 128x32 on I2C 0x3c)
CONFIG_ZMK_DISPLAY=y